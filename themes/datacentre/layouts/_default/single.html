{{ define "title" }}{{ .Title }} - {{ site.Title }}{{ end }}

{{ define "ogtype" }}article{{ end }}

{{ define "main" }}
<div class="hero post-hero">
	<img src="{{ site.Params.headerImage | relURL }}" alt="" aria-hidden="true">
</div>

<main class="wrap">
	<article class="post">
		<h1>{{ .Title }}</h1>
		<div class="meta">{{ partial "meta.html" (dict "page" . "linked" true) }}</div>

		<div class="post-content">
			{{ .Content }}
		</div>

		{{ with .GetTerms "tags" }}
		<div class="post-tags">
			<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
			{{ range . }}<a class="post-tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
		</div>
		{{ end }}
	</article>
</main>
{{ end }}
