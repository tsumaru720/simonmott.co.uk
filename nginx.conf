log_format  proxied  '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

server {
    listen 80 default_server;
    server_name simonmott.co.uk www.smott.co.uk smott.co.uk agari.co;

    server_tokens off;

    return 301 https://www.simonmott.co.uk$request_uri;
}

server {
    listen 80;
    server_name www.simonmott.co.uk dev.simonmott.co.uk localhost;

    set_real_ip_from 172.30.0.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log proxied;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubdomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    location = /blog/view/1  { return 301 /2009/08/my-website/; }
    location = /blog/view/2  { return 301 /2009/09/iggy-woes/; }
    location = /blog/view/3  { return 301 /2010/01/happy-new-year/; }
    location = /blog/view/4  { return 301 /2010/01/java-development/; }
    location = /blog/view/5  { return 301 /2010/04/nexus-one-web-meets-phone/; }
    location = /blog/view/6  { return 301 /2011/03/me-myself-and-i/; }
    location = /blog/view/7  { return 301 /2011/04/lan-events/; }
    location = /blog/view/8  { return 301 /2012/03/vpn-bonding/; }
    location = /blog/view/9  { return 301 /2012/02/office-2010-kms-activation-domain-relationships/; }
    location = /blog/view/10 { return 301 /2012/03/un2400-mobile-broadband-ubuntu-11-10/; }
    location = /blog/view/11 { return 301 /2013/08/full-screen-flash-video-linux/; }

    location ~ ^/lvm/?$         { return 301 /2010/03/logical-volume-manager-lvm/; }
    location ~ ^/vpn-bonding/?$ { return 301 /2012/03/vpn-bonding/; }
    location ~ ^/openssh/?$     { return 301 /2009/09/openssh/; }

    location = /images/vpn-bonding/vpn-bonding-diagram.png { return 301 /images/2016/05/vpn-bonding-diagram.png; }
    location = /images/iggy_broken_leg-02.09.09.jpg        { return 301 /images/2009/09/iggy_broken_leg-02.09.09.jpg; }
    location = /images/N1.jpg                              { return 301 /images/2016/05/N1.jpg; }
    location = /images/lan_big.jpg                         { return 301 /images/2016/05/lan_big.jpg; }
    location = /images/un2420.png                          { return 301 /images/2016/05/un2420.png; }
    location = /images/ghex.png                            { return 301 /images/2016/05/ghex.png; }

    location ^~ /wp-content/uploads/ {
        rewrite ^/wp-content/uploads/(.*)$ /images/$1 redirect;
    }

    location ~ ^/rss/?$   { rewrite ^ /index.xml last; }
    location ~ ^/feed/?$  { rewrite ^ /index.xml last; }

    location /images/ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|svg|ico|woff2?|ttf)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
