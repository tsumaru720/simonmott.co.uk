networks:
  infrastructure_proxy:
    external: true

services:
  web:
    build:
      context: .
      args:
        ENVIRONMENT: production
    restart: unless-stopped
    networks:
      - "infrastructure_proxy"
    environment:
      TZ: "Europe/London"
    volumes:
      - "./nginx-overrides:/etc/nginx/overrides.d"
    labels:
      com.chameth.vhost: "simonmott.co.uk www.simonmott.co.uk smott.co.uk www.smott.co.uk agari.co"
